name: CI

on:
  push:
    branches: [main, refactor-research]
  pull_request:
    branches: [main, refactor-research]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build C binaries and shared library
        run: make build-c build-ext

      - name: Install package (editable)
        run: make dev-install

      - name: Smoke test - Python module import
        run: python -c "import ra_prng2; print(ra_prng2.rot32(1, 1))"

      - name: Smoke test - ctypes binding
        run: |
          python -c "
          from bindings.cpython._ra_prng2 import RaPrng2
          r = RaPrng2(seed=42)
          v = r.next()
          assert 0 <= v <= 0xFFFFFFFF
          print('ctypes binding OK:', v)
          "

      - name: Run test suite
        run: make test
